<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <title>Mini Projeto JavaScript</title>
  </head>
  <body>
    <header>
      <input
        type="text"
        id="busca"
        onkeyup="pesquisarTarefas()"
        placeholder="pesquisar por título"
      />
    </header>
    <main>
      <section id="tarefas">
        <div class="todo">
          <h2>Tarefas</h2>
          <button onclick="abrirModal()">nova tarefa</button>
        </div>
        <!-- <h6>Nenhuma tarefa registrada</h6> -->
        <ul id="lista"></ul>
      </section>
      <section id="overlay" onclick="fecharModal()"></section>
      <div id="criarTarefa" class="modal">
        <form onsubmit="novaTarefa()">
          <h3>
            Criar tarefa
            <button onclick="fecharModal()">X</button>
          </h3>
          <label for="titulo">Título</label>
          <input type="text" id="titulo" required />
          <label for="descricao">Descrição</label>
          <textarea id="descricao" required></textarea>
          <button>Criar</button>
        </form>
      </div>
    </main>
    <script src="index.js"></script>
  </body>
</html>
